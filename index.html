<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ملف الإنجاز الإلكتروني</title><style id="st">
:root{--a:#0f766e;--bg:#f4f7f8;--c:#fff;--t:#16262b;--m:#5d7078;--b:#dbe4e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1719;--c:#16242a;--t:#e8f1f3;--m:#93a8af;--b:#27393f}}
:root[data-theme=dark]{--bg:#0e1719;--c:#16242a;--t:#e8f1f3;--m:#93a8af;--b:#27393f}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
.hero{position:relative;overflow:hidden;color:#fff;padding:36px 20px 44px;text-align:center;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,#0b1b3a))}
.hero:before{content:"";position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:34px 34px}
.fam .hero{background:linear-gradient(135deg,#b4506a,#d9822b 120%)}.fam .hero:before{background-image:radial-gradient(#fff 2px,transparent 2.5px);background-size:28px 28px;opacity:.2}
.hero svg.dec{position:absolute;opacity:.18;color:#fff}
.hero>*{position:relative}
.logo{width:96px;height:96px;border-radius:50%;background:#fff;object-fit:contain;padding:6px;box-shadow:0 6px 20px #0004;margin:0 auto 10px;display:block}
.ph{width:96px;height:96px;border-radius:50%;background:#fff3;border:2px dashed #fff9;margin:0 auto 10px;display:grid;place-items:center;font-size:12px}
h1{margin:4px 0;font-size:26px}.sub{opacity:.9;font-size:15px}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tag{background:#fff2;border:1px solid #fff5;border-radius:99px;padding:3px 14px;font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);border-bottom:1px solid var(--b);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,.chip{white-space:nowrap;font-size:13px;color:var(--t);text-decoration:none;border:1px solid var(--b);border-radius:99px;padding:4px 12px;background:var(--bg);cursor:pointer}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
main{max-width:980px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
section{background:var(--c);border:1px solid var(--b);border-radius:16px;margin:0 0 16px;overflow:hidden}
section.off{opacity:.5}
.sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--b);border-inline-start:5px solid var(--a)}
.ic{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);display:grid;place-items:center;flex:none}
.sh h2{margin:0;font-size:17px;flex:1}
.sb{padding:14px 16px;display:grid;gap:12px}
.it{border:1px solid var(--b);border-radius:12px;padding:12px;background:var(--bg)}
.it h3{margin:0 0 4px;font-size:15px}.nt{white-space:pre-wrap;color:var(--m);font-size:14px}
.bd{display:inline-block;font-size:11px;background:var(--a);color:#fff;border-radius:99px;padding:0 9px;margin-inline-start:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:zoom-in;border:1px solid var(--b)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fb{display:flex;align-items:center;gap:8px;border:1px solid var(--b);background:var(--c);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--t)}
.fb b{background:var(--a);color:#fff;border-radius:6px;font-size:10px;padding:2px 6px}
.qa{border:2px dashed var(--b);border-radius:12px;padding:10px;background:var(--c)}.qa textarea{resize:vertical}.pill{display:inline-block;background:var(--bg);border:1px solid var(--b);border-radius:99px;padding:1px 10px;font-size:12px;margin:2px}
.emp{color:var(--m);font-size:13px;text-align:center;padding:8px}
button,select,input,textarea{font:inherit;color:var(--t)}
.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:7px 14px;cursor:pointer;font-size:13px}
.btn.g{background:var(--bg);color:var(--t);border:1px solid var(--b)}.btn.r{background:#c0392b}
input,textarea,select{width:100%;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:7px 10px;margin:3px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.xx{cursor:pointer;color:#c0392b;font-weight:700;padding:0 4px}
#m{position:fixed;inset:0;background:#000d;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
#m.on{display:flex}#m img{max-width:100%;max-height:82%;border-radius:8px}#m iframe{width:100%;height:82%;border:0;background:#fff;border-radius:8px}
#m .btn{margin:8px 4px}
.toast{position:fixed;bottom:16px;inset-inline:16px;max-width:420px;margin:auto;background:#222;color:#fff;border-radius:10px;padding:10px 14px;z-index:10;font-size:14px}
footer{text-align:center;color:var(--m);font-size:12px;padding:20px}

xNRRRSGFFFFABRRRQAUUUUAFFFFABRRRQAUmPc0tFADdvOefzqpPp9tcZLAqT3U7f5dau0UAf/2Q==","accent":"#355265","secs":[{"t":"البيانات الشخصية","ic":"u","on":true,"items":[{"t":"التخصص:","n":"تقنية معلومات","sub":"","f":[]},{"t":"الدرجة العلمية:","n":"بكالوريوس","sub":"","f":[]},{"t":"سنوات الخبرة:","n":"سنة و نصف","sub":"","f":[]},{"t":"المرحلة الدراسية: ","n":"ابتدائي","sub":"","f":[]}]},{"t":"المقدمة","ic":"b","on":true,"items":[{"t":"","n":"بسم الله الرحمن الرحيم\n\nالحمد لله الذي جعل العلم نورًا، والتعليم رسالةً ساميةً تُسهم في بناء الأجيال وصناعة المستقبل، والصلاة والسلام على نبينا محمد ﷺ.\n\nيُعد ملف الإنجاز أحد الوسائل التي توثق مسيرتي المهنية والتعليمية، وتستعرض ما قدمته من جهود وممارسات تربوية وإنجازات خلال مسيرتي في مجال التعليم. كما يعكس حرصي على التطوير المستمر، وتنمية مهاراتي المهنية، وتوظيف الاستراتيجيات التعليمية والتقنيات الحديثة بما يسهم في تحسين العملية التعليمية وتحقيق نواتج تعلم فاعلة.\n\nويضم هذا الملف نماذج من أعمالي وإنجازاتي، والدورات التدريبية التي التحقت بها، والممارسات التعليمية التي طبقتها، بالإضافة إلى ما يعكس تطوري المهني وحرصي على تقديم تعليم نوعي يراعي احتياجات المتعلمات ويسهم في بناء جيل واعٍ ومبدع.\n\nأسأل الله أن يكون هذا العمل شاهدًا على ما بذلته من جهد، ودافعًا لي نحو المزيد من العطاء والتطوير والتميز في رسالتي التعليمية.","sub":"","f":[]}]},{"t":"الرؤية والرسالة","ic":"t","on":true,"items":[{"t":"","n":"","sub":"حاسب","f":[{"n":"83ce0395-0034-4e5f-8aa9-743412623368.jpeg","ty":"i","d":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAGAKADAAQAAAABAAAEAAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgEAAYAAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQE  الإسلام واعتزاز أمته. \n10.\tبيان الانسجام التام بين العلم والدين في شريعة الإسلام؛ فإن الإسلام دين ودنيا، والفكر الإسلامي يفي بمتطلبات الحياة البشرية في أرقى صورها في كل عصر. \n11.\tتكوين الفكر الإسلامي المنهجي لدى الأفراد ليصدروا عن تصور إسلامي موحد فيما يتعلق بالكون والإنسان والحياة، وما يتفرع عنها من تفصيلات. \n12.\tرفع مستوى الصحة النفسية بإدخال السكينة في نفس الطلبة، وتهيئة الجو المدرسي المناسب. \n13.\tتشجيع وتنمية روح البحث والتفكير العلميين، وتقوية القدرة على المشاهدة والتأمل، وتبصير الطلبة بآيات الله في الكون وما فيه، وإدراك حكمة الله في خلقه، لتمكن الفرد من الاضطلاع بدوره الفعال في بناء الحياة الاجتماعية وتوجيهها توجيهًا سليمًا.\n14.\tالاهتمام بالإنجازات العالمية في ميادين العلوم والآداب والفنون المباحة، وإظهار أن تقدم العلوم ثمرة جهود الإنسانية عامة، وإبراز ما أسهم به أعلام الإسلام في هذا المجال، وتعرّف الناشئة برجالات الفكر الإسلامي، وتبيان نواحي الابتكار في أعمالهم وآرائهم في مختلف الميادين العلمية والعملية. \n15.\tتنمية الفكر الرياضي والمهارات الحسابية، والتدريب على استعمال لغة الأرقام والإفادة منها. \n16.\tتنمية مهارات القراءة وعادة المطالعة سعيًا وراء زيادة المعارف. \n17.\tاكتساب القدرة على التعبير الصحيح في التخاطب والتحدث والكتابة بلغة سليمة وتفكير منظم. \n18.\tتنمية القدرة اللغوية بشتى الوسائل التي تغذي اللغة العربية، وتساعد على تذوقها وإدراك نواحي الجمال فيها. \n19.\tتدريس التاريخ مادة منهجية مع استخلاص العبرة منه، وبيان وجهة نظر الإسلام فيما يتعارض معه، وإبراز المواقف الخالدة في تاريخ الإسلام وحضارة أمته حتى تكون قدوة للأجيال المسلمة، وتولد لديها الثقة والإيجابية. \n20.\tتبصير الطلبة بوطنهم من أمجاد إسلامية تليدة، وحضارة عالية إنسانية عريقة، ومزايا جغرافية وطبيعية واقتصادية، وما لمكانته من أهمية بين أمم الدنيا. \n21.\tفهم البيئة بأنواعها المختلفة، وتوسيع آفاق الطلبة بالتعرف على مختلف أقطار العالم، وما يتميز به كل قطر من إنتاج وثروات طبيعية، مع التأكيد على ثروات بلادنا ومواردها الخام ومركزها الجغرافي، وطرق المواصلات السياسية التي تربطها، وضرورة الحفاظ على عالم الإسلام والقيام بواجب دعوته وإظهار مكانة العالم الإسلامي. \n22.\tتزويد الطلبة بلغة أخرى من اللغات الحية على الأقل، بجانب لغتهم الأصلية للتزود من العلوم والمعارف والفنون والابتكارات النافعة، والعمل على نقل علومنا ومعارفنا إلى المجتمعات الأخرى، إسهامًا في نشر الإسلام وخدمة الإنسانية. \n23.\tتعويد الطلبة العادات الصحية السليمة، ونشر الوعي الصحي. \n24.\tاكتساب الطلبة المهارات الحركية التي تستند إلى القواعد الرياضية لبناء الجسم السليم، حتى يؤدي الفرد واجباته في خدمة دينه ومجتمعه بقوة وثبات. \n25.\tمسايرة خصائص مراحل النمو النفسي للطلبة في كل مرحلة، ومساعدة الفرد على النمو السوي روحيًا وعقليًا واجتماعيًا، والتأكيد على الناحية الروحية الإسلامية، بحيث تكون هي الموجه الأول للسلوك الخاص والعام للفرد والمجتمع. \n26.\tالتعرف على الفروق الفردية بين الطلبة لحسن توجيههم ومساعدتهم على النمو وفق قدراتهم واستعداداتهم وميولهم.\n27.\tالعناية بالمتأخرين دراسيًا والعمل على إزالة ما يمكن من أسباب هذا التأخر، ووضع برامج خاصة دائمة ومؤقتة وفق حاجاتهم. \n28.\tالتربية الخاصة والعناية بالطلبة المعاقين جسميًا أو عقليًا، على هدي الإسلام الذي يجعل التعليم حقًا مشاعًا بين جميع أبناء الأمة. \n29.\tالاهتمام باكتشاف الموهوبين ورعايتهم، وإتاحة الإمكانيات والفرص المختلفة لنمو مواهبهم في إطار البرامج العامة، ووضع برامج خاصة. \n30.\tتدريب الطاقة البشرية اللازمة، وتنويع التعليم مع الاهتمام الخاص المهني.","sub":"","f":[]}]},{"t":"خصائص النمو للمرحلة العمرية","ic":"g","on":true,"items":[{"t":"","n":"يمر طلاب المرحلة الابتدائية، من الصف الأول إلى الصف الرابع، بمرحلة مهمة من مراحل النمو، حيث تظهر لديهم مجموعة من الخصائص الجسمية والعقلية والانفعالية والاجتماعية واللغوية.\n\n* النمو الجسمي والحركي: يزداد نمو الطفل وطوله ووزنه تدريجيًا، وتتطور مهاراته الحركية والتناسق بين اليد والعين، ويصبح أكثر قدرة على أداء الأنشطة والمهارات المختلفة.\n* النمو العقلي والمعرفي: تتطور قدرة الطفل على التفكير والفهم والملاحظة والتذكر، ويصبح أكثر قدرة على التعلم وحل المشكلات وربط المعلومات بالخبرات والمواقف اليومية.\n* النمو اللغوي: يزداد مخزون الطفل اللغوي، وتتطور قدرته على القراءة والكتابة والتعبير عن أفكاره ومشاعره والتواصل مع الآخرين.\n* النمو الانفعالي: يبدأ الطفل في فهم مشاعره والتعبير عنها بشكل أفضل، ويحتاج إلى التشجيع والتعزيز وبناء الثقة بالنفس والشعور بالأمان.\n* النمو الاجتماعي: يزداد اهتمام الطفل بتكوين الصداقات والتفاعل مع زملائه، ويتعلم التعاون والمشاركة واحترام القواعد وتحمل المسؤولية.\n* النمو الأخلاقي: يبدأ الطفل في فهم القيم والسلوكيات الصحيحة والخاطئة، وتزداد قدرته على الالتزام بالقواعد واحترام الآخرين.\n\nلذلك، ينبغي مراعاة خصائص النمو عند التخطيط للتدريس والأنشطة الصفية، وتقديم الخبرات التعليمية التي تتناسب مع احتياجات الطلاب وقدراتهم ومرحلتهم العمرية.","sub":"","f":[]}]},{"t":"الشهادات","ic":"a","on":true,"items":[]},{"t":"دروس مميزة","ic":"m","on":true,"items":[]},{"t":"دروس تطبيقية","ic":"c","on":false,"items":[]},{"t":"المبادرات","ic":"s","on":true,"items":[]},{"t":"الدورات","ic":"s","on":true,"items":[]},{"t":"الأنشطة والمشاركات المدرسية","ic":"r","on":true,"items":[]},{"t":"نماذج من أعمال الطلاب","ic":"f","on":true,"items":[]},{"t":"نماذج أوراق العمل والاختبارات","ic":"f","on":true,"items":[]},{"t":"نماذج من شهادات تكريم الطلاب","ic":"a","on":true,"items":[{"t":"","n":"","sub":"حاسب","f":[{"n":"WhatsApp Image 2026-05-05 at 3.18.43 AM5.jpeg","ty":"i","d":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAOJBQADASIAAhEBAxEB/8QAHQABAAIDAQEBAQAAAA const P={u:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',b:'<path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM8 7h8"/>',t:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',a:'<circle cx="12" cy="8" r="6"/><path d="M8 14l-2 8 6-3 6 3-2-8"/>',m:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',c:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',f:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>',g:'<path d="M3 3v18h18M7 15l4-5 3 3 5-7"/>',h:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',l:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/>',k:'<path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8M8 3v6M18 3c-2 2-3 5-3 8h3v10"/>',s:'<path d="M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 6.7 21.5l1.6-7.2L3 9.6 10 9z"/>',r:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/><circle cx="12" cy="12" r="3"/>'};
const IC=['u','b','t','t','g','a','m','c','s','s','r','f','f','a','r','g','s'];
const NAMES=['البيانات الشخصية','المقدمة','الرؤية والرسالة','أهداف سياسة التعليم في المملكة','خصائص النمو للمرحلة العمرية','الشهادات','دروس مميزة','دروس تطبيقية','المبادرات','الدورات','الأنشطة والمشاركات المدرسية','نماذج من أعمال الطلاب','نماذج أوراق العمل والاختبارات','نماذج من شهادات تكريم الطلاب','الخطة العلاجية والإثرائية وشواهدها','تحليل نتائج الاختبارات لكل فترة','إنجازات أخرى'];
if(!S.secs)S.secs&&S.secs.forEach(x=>x.items.forEach(i=>{if(i.sub==='تربية أسرية')i.sub=FAM}));
if(!S.secs)S={school:'اسم المدرسة',name:'اسم المعلمة',year:'١٤٤٨هـ',logo:'',accent:'#0f766e',secs:NAMES.map((t,i)=>({t,ic:IC[i],on:true,items:[]}))};
const ico=k=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]||P.f}</svg>`;
const dec=(s,p,k)=>`<svg class="dec" style="${p}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">${P[k]}</svg>`;
function render(){
 const fam=!edit&&flt===FAM;
 document.documentElement.style.setProperty('--a',fam?'#b4506a':(S.accent||'#0f766e'));
 document.documentElement.classList.toggle('fam',fam);
 const vis=S.secs.map((s,i)=>({s,i})).filter(o=>edit||o.s.on);
 const D1=fam?'h':'c',D2=fam?'l':'c',D3=fam?'k':'c';
 let h=`<div class="hero">${dec(120,'top:10px;right:10px',D1)}${dec(90,'bottom:8px;left:12px',D2)}${dec(60,'top:60px;left:30%',D3)}
 ${S.logo?`<img class="logo" src="${S.logo}">`:`<div class="ph">${edit?'الشعار':''}</div>`}
 <div class="sub">${esc(S.school)}</div><h1>ملف الإنجاز الإلكتروني</h1><div>${esc(S.name)} · ${esc(S.year)}</div>
 <div class="tags"><span class="tag">معلمة حاسب</span><span class="tag">معلمة مهارات حياتية وأسرية</span></div></div>
 <nav>${vis.filter(o=>o.s.on).map(o=>`<a href="#s${o.i}">${esc(o.s.t)}</a>`).join('')}</nav><main>`;
 if(edit)h+=`<div class="it" style="margin-bottom:14px"><b>إعدادات الملف</b><div class="row"><input data-g="school" value="${esc(S.school)}" placeholder="اسم المدرسة"><input data-g="name" value="${esc(S.name)}" placeholder="اسم المعلمة"><input data-g="year" value="${esc(S.year)}" placeholder="العام"></div>
 <div class="row"><label class="btn g">رفع شعار المدرسة<input type="file" accept="image/*" hidden data-logo></label><span class="emp">يتم أخذ ألوان التصميم من الشعار تلقائياً</span></div>
 <div class="row"><button class="btn" data-act="pub">حفظ ونشر للوكيلة</button><button class="btn g" data-act="add">+ قسم جديد</button><button class="btn g" data-act="view">معاينة</button><button class="btn g" data-act="lnk">🔗 نسخ رابط الوكيلة</button><button class="btn g" data-act="bk">⬇ نسخة احتياطية</button></div></div>`;
 else h+=`<div class="bar"><span class="emp">تصفية:</span>${SUBS.map(x=>`<span class="chip ${flt===x?'on':''}" data-act="f" data-v="${x}">${x||'الكل'}</span>`).join('')}${can?'<button class="btn" data-act="ed" style="margin-inline-start:auto">تعديل الملف</button>':''}</div>`;
 for(const {s,i} of vis){
  const its=s.items.map((it,j)=>({it,j})).filter(o=>edit||!flt||!o.it.sub||o.it.sub===flt);
  h+=`<section id="s${i}" class="${s.on?'':'off'}"><div class="sh"><div class="ic">${ico(s.ic)}</div>${edit?`<input data-s="${i}" data-k="t" value="${esc(s.t)}" style="flex:1">`:`<h2>${esc(s.t)}</h2>`}
  ${edit?`<button class="btn g" data-act="tg" data-s="${i}">${s.on?'👁 ظاهر':'🚫 مخفي'}</button><button class="btn g" data-act="up" data-s="${i}">↑</button><button class="btn g" data-act="dn" data-s="${i}">↓</button>`:''}</div><div class="sb">`;
  if(!its.length)h+=`<div class="emp">لا توجد محتويات بعد</div>`;
  for(const {it,j} of its){
   h+=`<div class="it">`;
   if(edit)h+=`<div class="row"><input data-s="${i}" data-i="${j}" data-k="t" value="${esc(it.t)}" placeholder="العنوان" style="flex:2"><select data-s="${i}" data-i="${j}" data-k="sub" style="flex:1">${SUBS.map(x=>`<option value="${x}" ${it.sub===x?'selected':''}>${x||'كل المواد'}</option>`).join('')}</select></div><textarea rows="3" data-s="${i}" data-i="${j}" data-k="n" placeholder="الوصف">${esc(it.n)}</textarea>`;
   else h+=`<h3>${esc(it.t)}${it.sub?`<span class="bd">${it.sub}</span>`:''}</h3>${it.n?`<div class="nt">${esc(it.n)}</div>`:''}`;
   const im=it.f.map((f,k)=>({f,k})).filter(o=>o.f.ty==='i'),dc=it.f.map((f,k)=>({f,k})).filter(o=>o.f.ty!=='i');
   if(im.length)h+=`<div class="gal">${im.map(o=>`<div style="position:relative"><img src="${o.f.d}" data-act="img" data-s="${i}" data-i="${j}" data-k="${o.k}">${edit?`<span class="xx" style="position:absolute;top:4px;left:4px;background:#fff;border-radius:6px" data-act="rf" data-s="${i}" data-i="${j}" data-k="${o.k}">✕</span>`:''}</div>`).join('')}</div>`;
   if(dc.length)h+=`<div class="fl">${dc.map(o=>`<div class="fb" data-act="doc" data-s="${i}" data-i="${j}" data-k="${o.k}"><b>${o.f.ty==='p'?'PDF':'PPT'}</b>${esc(o.f.n)}${edit?`<span class="xx" data-act="rf" data-s="${i}" data-i="${j}" data-k="${o.k}">✕</span>`:''}</div>`).join('')}</div>`;
   if(edit)h+=`<div class="row" style="margin-top:8px"><label class="btn g">📎 إرفاق<input type="file" multiple accept="image/*,.pdf,.ppt,.pptx" hidden data-up data-s="${i}" data-i="${j}"></label><button class="btn r" data-act="di" data-s="${i}" data-i="${j}">حذف العنصر</button></div>`;
   h+=`</div>`;
  }
  if(edit){const q=Q[i]||(Q[i]={t:'',n:'',sub:'',f:[]});h+=`<div class="qa"><b style="font-size:13px">إضافة جديدة</b><div class="row"><input data-q="${i}" data-k="t" value="${esc(q.t)}" placeholder="العنوان" style="flex:2"><select data-q="${i}" data-k="sub" style="flex:1">${SUBS.map(x=>`<option value="${x}" ${q.sub===x?'selected':''}>${x||'كل المواد'}</option>`).join('')}</select></div><textarea rows="3" data-q="${i}" data-k="n" placeholder="اكتبي هنا...">${esc(q.n)}</textarea><div class="row"><label class="btn g" title="إرفاق ملف">📎 إرفاق<input type="file" multiple accept="image/*,.pdf,.ppt,.pptx" hidden data-qup="${i}"></label>${q.f.map(f=>`<span class="pill">${esc(f.n)}</span>`).join('')}<button class="btn" data-act="qa" data-s="${i}" style="margin-inline-start:auto">إضافة</button></div></div>`}
  h+=`</div></section>`;
 }
 $('#root').innerHTML=h+`</main><footer>${esc(S.school)} · ${esc(S.name)}</footer>`;
}
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)};
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const cmp=(f,m=1600)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
function dom(d){try{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');const i=new Image();return new Promise(r=>{i.onload=()=>{x.drawImage(i,0,0,24,24);const p=x.getImageData(0,0,24,24).data;let R=0,G=0,B=0,n=0;for(let q=0;q<p.length;q+=4){const mx=Math.max(p[q],p[q+1],p[q+2]),mn=Math.min(p[q],p[q+1],p[q+2]);if(p[q+3]>200&&mx-mn>50&&mx<235){R+=p[q];G+=p[q+1];B+=p[q+2];n++}}r(n?'#'+[R,G,B].map(v=>Math.round(v/n*.8).toString(16).padStart(2,'0')).join(''):null)};i.src=d})}catch(e){return Promise.resolve(null)}}
function blob(d){const [h,b]=d.split(','),s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:h.slice(5,h.indexOf(';'))})}
const M=$('#m'),close=()=>{M.className='';M.innerHTML=''};

function build(){const js=JSON.stringify(S).replace(/</g,'\\u003c');
if(js.length>14e6){toast('حجم الملف كبير جداً، قلّلي الصور أو الملفات');return null}
 return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ملف الإنجاز الإلكتروني</title><style id="st">'+$('#st').textContent+'</style></head><body><div id="root"></div><div id="m"></div><script id="d" type="application/json">'+js+'<\/script><script id="app">'+$('#app').textContent+'<\/script></body></html>'}
async function lnk(){const u=location.href.split('?')[0].split('#')[0];try{await navigator.clipboard.writeText(u);toast('تم نسخ رابط الوكيلة')}catch(e){prompt('انسخي الرابط:',u)}}
const gcfg=()=>JSON.parse(localStorage.getItem('gh')||'null');
async function save(){
 const html=build();if(!html)return;
 let c=gcfg();
 if(!c){const r=prompt('اسم المستودع بصيغة: اسم-المستخدم/اسم-المستودع');if(!r)return;const t=prompt('الصقي توكن GitHub (يُحفظ في متصفحك فقط)');if(!t)return;const p=prompt('اسم ملف الصفحة في المستودع','index.html')||'index.html';c={r:r.trim(),t:t.trim(),p:p.trim()};localStorage.setItem('gh',JSON.stringify(c))}
 const u='https://api.github.com/repos/'+c.r+'/contents/'+c.p,H={Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'};
 try{toast('جارٍ النشر...');
  const g=await fetch(u+'?t='+Date.now(),{headers:H});
  if(g.status===401||g.status===403||g.status===404){localStorage.removeItem('gh');throw new Error('تحققي من اسم المستودع والتوكن ثم أعيدي المحاولة')}
  const sha=g.ok?(await g.json()).sha:undefined;
  const b=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(new Blob([html],{type:'text/html'}))});
  const p=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:'تحديث ملف الإنجاز',content:b,sha})});
  if(!p.ok)throw new Error((await p.json()).message||p.status);
  dirty=false;toast('تم النشر. يظهر عند الوكيلة خلال دقيقة تقريباً');lnk()
 }catch(e){toast('تعذّر النشر: '+e.message)}
}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.q!==undefined){Q[d.q][d.k]=t.value;return}if(d.g){S[d.g]=t.value;dirty=true}else if(d.k&&d.s!==undefined){const s=S.secs[d.s];if(d.i!==undefined)s.items[d.i][d.k]=t.value;else s[d.k]=t.value;dirty=true}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
 if(d.k==='sub'){if(d.q!==undefined)Q[d.q].sub=t.value;render();return}
 if(d.qup!==undefined){await addF(Q[d.qup].f,t.files);render();return}
 if(t.hasAttribute('data-logo')&&t.files[0]){S.logo=await cmp(t.files[0],400);const c=await dom(S.logo);if(c)S.accent=c;dirty=true;render()}
 if(t.hasAttribute('data-up')){await addF(S.secs[d.s].items[d.i].f,t.files);dirty=true;render()}});
async function addF(arr,files){for(const f of files){if(f.type.startsWith('image/'))arr.push({n:f.name,ty:'i',d:await cmp(f)});else if(f.size>8e6)toast('الملف '+f.name+' أكبر من 8 ميجا');else arr.push({n:f.name,ty:/pdf/i.test(f.name)?'p':'x',d:await rd(f)})}}
document.addEventListener('click',async e=>{
 if(e.target===M){close();return}
 const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset,s=S.secs[d.s],it=s&&s.items[d.i];e.stopPropagation();
 switch(d.act){
 case 'f':flt=d.v;render();break;
 case 'ed':edit=true;render();scrollTo(0,0);break;
 case 'view':edit=false;render();break;
 case 'pub':await save();break;
 case 'lnk':await lnk();break;
 case 'bk':{const h=build();if(h)try{await dl.save({filename:'portfolio.html',data:new Blob([h],{type:'text/html'})})}catch(e){}break}
 case 'add':{const t=prompt('اسم القسم الجديد');if(t){S.secs.push({t,ic:'s',on:true,items:[]});dirty=true;render()}break}
 case 'tg':s.on=!s.on;dirty=true;render();break;
 case 'up':case 'dn':{const i=+d.s,j=d.act==='up'?i-1:i+1;if(S.secs[j]){[S.secs[i],S.secs[j]]=[S.secs[j],S.secs[i]];render()}break}
 case 'qa':{const q=Q[d.s];if(!q.t&&!q.n&&!q.f.length)return toast('اكتبي نصاً أو أرفقي ملفاً');s.items.push(q);Q[d.s]=null;delete Q[d.s];dirty=true;render();break}
 case 'di':if(confirm('حذف هذا العنصر؟')){s.items.splice(d.i,1);render()}break;
 case 'rf':it.f.splice(d.k,1);render();break;
 case 'img':{const f=it.f[d.k];M.className='on';M.innerHTML=`<img src="${f.d}"><button class="btn" data-act="x">إغلاق</button>`;break}
 case 'x':close();break;
 case 'doc':{const f=it.f[d.k];if(f.ty==='p'){const u=URL.createObjectURL(blob(f.d));M.className='on';M.innerHTML=`<iframe src="${u}"></iframe><div><button class="btn" data-act="x">إغلاق</button><button class="btn g" data-act="sv" data-s="${d.s}" data-i="${d.i}" data-k="${d.k}">تحميل</button></div>`}else{await sv(f)}break}
 case 'sv':await sv(it.f[d.k]);break}
});
async function sv(f){try{await dl.save({filename:f.n,data:blob(f.d)})}catch(e){if(e.code!=='declined')toast('تعذّر التحميل')}}
window.addEventListener('beforeunload',e=>{if(edit&&dirty)e.preventDefault()});
render();
dl={save:async({filename:n,data:b})=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove()}};
can=/[?&]edit\b/.test(location.search);render();
</script></body></html>
